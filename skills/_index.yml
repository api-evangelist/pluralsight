cross_cutting_rules:
- Read extensions.warnings on EVERY response - it carries deprecation notices and the silent page-size truncation notice.
- Read errors[] on EVERY response - GraphQL returns HTTP 200 on field-level failure.
- No idempotency key and no dry-run mode exist on any mutation. Never blind-retry a write.
- Page with first/after at 1000 records; read pageInfo.endCursor and pageInfo.hasNextPage.
- Use psUserId (UUID). The legacy userId was removed 2025-11-10 and is not convertible.
- A General-Release key fails the entire call if any selected field at any depth is tagged Beta.
