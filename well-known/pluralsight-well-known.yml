method: probed
source: live HTTPS GETs of /.well-known/* on every apis.yml baseURL host, every OpenAPI servers[] host, the docs host, and the MCP host
provider: Pluralsight
providerId: pluralsight
description: >-
  Pluralsight serves an RFC 9116 security.txt from every pluralsight.com host that answers
  (canonicalised to https://pluralsight.com/.well-known/security.txt), and its remote MCP gateway
  at mcp.pluralsight.com publishes a full OAuth discovery set - RFC 8414 authorization-server
  metadata, RFC 9728 protected-resource metadata, and an OpenID Connect discovery document.
  No /.well-known/api-catalog and no A2A agent card is served on any host.
notes:
  - >-
    app.pluralsight.com answers HTTP 200 with the same 9,887-byte single-page-app HTML shell for
    EVERY /.well-known/* path probed. Those are catch-all shells, not documents, and are recorded
    below with status 200 and a shell note so they are never mistaken for a served surface.
  - >-
    paas-api.pluralsight.com returns 401 {"error":"AuthenticationError: Invalid API Key"} for every
    path other than security.txt - the API gateway authenticates before routing, so a well-known
    document could not be ruled in or out there.
