description: >-
  Pluralsight publishes NO first-party client library for any of its APIs. Its own "Examples" and
  "Using GraphQL" docs point callers at generic third-party GraphQL clients (the GraphQL Playground,
  the Graphios library, the Apollo Client library) rather than at a Pluralsight SDK. The two
  packages that own the `pluralsight` name on npm and PyPI are community projects, both abandoned,
  and both written against the REST APIs Pluralsight removed on 2025-11-10.
