gaps:
- >-
    Field-level types, nullability and enum values are not readable anonymously - the GraphQL
    endpoint returns 401 to introspection and the portal schema pages render client-side.
- >-
    No id-prefix convention is published (unlike Stripe-style typed prefixes); psUserId is a bare
    UUID and other ids are opaque.
