provider: Pluralsight
providerId: pluralsight
description: >-
  Entity-relationship graph for the Pluralsight Skills platform, derived from the published
  71-operation GraphQL index (operation name + category + Query/Mutation kind), the OpenAPIs in this
  repo, and the harvested request/response examples. Field-level types are OAuth/API-key gated, so
  relationships are inferred from operation naming and from the deprecation guide's field-mapping
  tables (which name the exact foreign keys), not from a readable schema document.
identifiers:
- name: psUserId
  type: UUID
  entity: User
  note: >-
    The canonical user identifier since the 2025 deprecation programme. Replaced an integer/string
    userId across every query and mutation; the two are NOT interchangeable - the deprecation guide
    states each user's psUserId differs from that user's legacy userId.
- name: userId
  type: legacy
  entity: User
  status: removed
  removed: '2025-11-10'
- name: planId
  type: ID
  entity: Plan
- name: channelId
  entity: Channel
- name: teamId
  entity: Team
- name: roleId
  entity: Role
- name: courseId
  entity: Course
- name: inviteId
  entity: Invite
  note: renamed from field.inviteId to input.inviteId on cancelInvite (changelog 2023-11-01).
