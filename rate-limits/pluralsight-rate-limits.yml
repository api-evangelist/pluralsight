specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Pluralsight
providerId: pluralsight
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: searched
modified: '2026-08-29'
source: https://developer.pluralsight.com/docs/getting-started/faqs
reconciled: false
tags:
  - Rate Limiting
  - Learning
  - Engineering Metrics
notes: Pluralsight does not publish numeric rate limits for its Skills GraphQL, Flow REST, or legacy
  Reports / Licensing REST APIs in its public help documentation. Access to the APIs is gated to
  Business / Enterprise / Flow contracts and limits are governed by fair-use plus customer-success
  escalation rather than a published per-second / per-minute ceiling.
description: Pluralsight gates its APIs behind Business, Enterprise, and Flow contracts. The provider
  does not publish per-key rate limits or rate-limit response headers in its public help center;
  abuse and concurrency thresholds are managed via the customer success team. Standard 429 responses
  apply on throttling. Consumers should implement exponential backoff and contact their account
  representative if they encounter sustained throttling.
sources:
  - https://developer.pluralsight.com/docs/getting-started/faqs
  - https://developer.pluralsight.com/docs/getting-started/pagination
  - https://help.pluralsight.com/help/skills-business-customer-api
  - https://help.pluralsight.com/help/api-introduction
searched: '2026-08-29'
searchedFinding: >-
  Pluralsight's developer-portal FAQ confirms a rate limit exists and ties it directly to page size:
  "Is there any rate limit for the APIs? Yes, and if you follow the recommendation of extracting
  1000 records per page/API request, you shouldn't hit the limit." No number, no window, no burst
  and no rate-limit response headers are published anywhere on developer.pluralsight.com. The
  documented 1000-record batch recommendation is the only quantified control the provider gives a
  consumer, and exceeding it does NOT return 429 - it silently reduces the result set and reports
  the reduction in extensions.warnings.
responseHeaders: []
responseHeadersNote: >-
  Probed and searched 2026-08-29 - Pluralsight publishes no X-RateLimit-*, no RateLimit-* and no
  Retry-After contract. An agent has no runtime signal for how close it is to the limit.
batchLimit:
  recommended_records_per_request: 1000
  overage_behaviour: silent truncation with a warning in extensions.warnings
  docs: https://developer.pluralsight.com/docs/getting-started/pagination
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Skills GraphQL API (paas-api.pluralsight.com)
    scope: api-key
    metric: varies
    limit: 'not publicly documented; governed by fair-use'
    notes: Subject to Business / Enterprise contract. Pagination is enforced (page-size caps in the
      GraphQL schema).
  - name: Flow REST API (flow-api.pluralsight.com / appfireflow.com)
    scope: api-key
    metric: varies
    limit: 'not publicly documented; governed by fair-use'
    notes: Per-tenant. Bulk historical pulls should be paginated and run during off-peak.
  - name: Legacy Reports / Licensing REST APIs (app.pluralsight.com)
    scope: api-key
    metric: varies
    limit: 'not publicly documented; legacy endpoints scheduled for deprecation'
policies:
  - name: Fair Use
    description: Pluralsight does not publish numeric thresholds; sustained or abusive usage is
      handled by the customer success team rather than auto-throttle headers.
  - name: Backoff
    description: On 429 / 503, retry with exponential backoff and jitter. Honor any Retry-After
      header if returned.
  - name: Pagination
    description: GraphQL APIs require cursor-based pagination; do not request unbounded result sets.
  - name: Escalation
    description: If you hit sustained throttling, contact your Pluralsight customer success manager
      to discuss higher capacity or batch export options.
maintainers:
