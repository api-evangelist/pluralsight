name: Pluralsight MCP Gateway
description: >-
  Pluralsight runs a live, remote Model Context Protocol server at https://mcp.pluralsight.com/mcp.
  It is a real MCP endpoint, not a marketing page: an unauthenticated JSON-RPC tools/list call
  returns a protocol-level error object ({"jsonrpc":"2.0","id":0,"error":{"code":-32001,
  "message":"Missing Bearer token"}}) and the 401 carries an RFC 9728 challenge -
  WWW-Authenticate: Bearer error="invalid_token",
  resource_metadata="https://mcp.pluralsight.com/.well-known/oauth-protected-resource".
  The tool list itself is behind OAuth, so the tool names and inputSchemas could not be enumerated
  anonymously. Pluralsight publishes no public documentation for this endpoint that this pass could
  find - it was discovered by probe, not by docs.
deployment:
  mode: remote
  endpoint: https://mcp.pluralsight.com/mcp
  auth: oauth
  verified: probed
