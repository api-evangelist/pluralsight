  detail: Missing, malformed, revoked or wrong-plan API key.
  remediation: >-
    Regenerate or re-check the key on https://developer.pluralsight.com/manage-keys and confirm the
    plan has the API entitlement on https://developer.pluralsight.com/plan-permissions.
