- code: '429'
  title: Too Many Requests
  applies_to:
  - getCourseCatalog
  - getCodingMetrics
  - getCollaborationMetrics
  - getCommits
  - getDoraMetrics
  - manageChannels
  - listIntegrations
  - listInvitations
