  - listUsers
  - listTeams
  - getPullRequests
  - downloadUserReport
  - downloadCourseCompletionReport
  - downloadCourseUsageReport
  - getRepos
  - getTickets
  - updateUsers
  detail: Rate limit exceeded. No numeric limit and no rate-limit headers are published.
  remediation: >-
    Back off exponentially with jitter, honour Retry-After if present, and reduce page size toward
    the documented 1000-record recommendation.
  retriable: true
- code: '503'
  title: Service Unavailable
  applies_to: []
  detail: >-
    Declared in rate-limits/pluralsight-rate-limits.yml as a throttling/availability response; not
    declared by any OpenAPI operation in this repo.
  retriable: true
gaps:
- No published error-code reference page on developer.pluralsight.com.
- No machine-readable error taxonomy, no stable error codes, and no problem+json media type.
- >-
    No 4xx coverage beyond 401/429 in any spec - validation failures on the 24 GraphQL mutations
    have no documented shape at all.
