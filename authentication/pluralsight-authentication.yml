profiles:
- surface: Skills GraphQL API
  endpoint: https://paas-api.pluralsight.com/graphql
  type: apiKey
  transport: bearer credential in the HTTP Authorization header
  issuance: >-
    A Pluralsight PLAN ADMIN mints the key on https://developer.pluralsight.com/manage-keys. A
    non-admin cannot request one directly - they must ask a plan admin. Multiple keys per plan are
    supported.
  entitlement:
  - >-
      Plan level - whether the plan carries the API entitlement at all, visible on
      https://developer.pluralsight.com/plan-permissions.
  - >-
      Key level - the release stage attached to the individual key (General Release / Beta / Alpha).
      Beta is a self-serve toggle on the key; Alpha is by invitation from support@pluralsight.com.
  scopes: []
  scopes_note: >-
    There are no scopes. A key carries whatever its plan carries; an agent cannot request a narrower
    grant.
  key_metadata:
  - >-
      Each key should carry an email address - that address is how Pluralsight sends deprecation
      notices for operations the key is observed using.
  unauthenticated_response: '401 {"error":"AuthenticationError: Invalid API Key"}'
  observed: '2026-08-29'
